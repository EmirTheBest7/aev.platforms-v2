# ALIEV.IO — nginx front for php-fpm. Document root is public/ only; nothing else is web-reachable.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 64k;

    # Never serve dotfiles (.env, .git, .htaccess) — .well-known excepted.
    location ~ /\.(?!well-known) { return 404; }

    location /build/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff always;
    }

    location = /favicon.ico { try_files $uri =404; }
    location = /robots.txt  { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_read_timeout 15s;
    }

    # Any other .php request is not a valid entry point.
    location ~ \.php$ { return 404; }
}
