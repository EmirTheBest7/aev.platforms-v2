# ALIEV.IO — document root is public/ ONLY. Rewrite rules live here (not in .htaccess) so they cannot
# be bypassed or overridden; public/.htaccess carries the same rules for hosts without this vhost.
<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    <Directory /var/www/html/public>
        Options -Indexes -MultiViews +FollowSymLinks
        # /downloads is both a URL of the application and a directory of files: no automatic "/downloads/" redirect
        DirectorySlash Off
        AllowOverride None
        Require all granted

        RewriteEngine On
        # 1. never expose dotfiles (allow /.well-known/)
        RewriteRule "(^|/)\.(?!well-known/)" - [R=404,L]
        # 2. the only executable entry point
        RewriteRule ^index\.php$ - [L]
        # 3. no other script is ever executed or downloaded
        RewriteRule \.(php|phtml|phar|inc|sql|md|log|ini|env|bak|dist)$ - [R=404,L]
        # 4. static pages: a directory that ships an index.html is served at its trailing-slash URL
        #    (wallpaper maker, retained _api bundle). Other directories (e.g. /downloads) belong to the application.
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteCond %{REQUEST_FILENAME}/index.html -f
        RewriteRule [^/]$ %{REQUEST_URI}/ [R=301,L]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteCond %{REQUEST_FILENAME}/index.html -f
        RewriteRule ^ %{REQUEST_URI}index.html [L]
        # 5. existing static files are served directly
        RewriteCond %{REQUEST_FILENAME} -f
        RewriteRule ^ - [L]
        # 6. everything else is the application's (routing, redirects, 404 page)
        RewriteRule ^ index.php [L]
    </Directory>

    # Static assets: long cache, no sniffing
    <LocationMatch "^/(build|downloads|home/_api)/.*\.(css|js|woff2?|ttf|otf|svg|png|jpe?g|gif|webp|ico|mp3|mp4|json|pdf)$">
        Header always set X-Content-Type-Options "nosniff"
        Header always set Cache-Control "public, max-age=604800"
    </LocationMatch>

    # An SVG opened directly (a download, a link) must never run scripts in the site's origin.
    # (Used as <img>/CSS images it is unaffected: this header only applies to the SVG as a document.)
    <LocationMatch "\.svg$">
        Header always set Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; sandbox"
    </LocationMatch>

    Include /etc/apache2/aliev-api-csp.conf
</VirtualHost>
