# Content-Security-Policy for the RETAINED static bundle under /home/_api/ (UI, terminal, Docs, tools, small pages).
# These pages are legacy: they use inline scripts/styles and a handful of third-party CDNs (listed below, derived
# from a scan of the bundle). The strict site-wide policy (docs/SECURITY.md) applies everywhere else.
# "setifempty": the PHP endpoints under /home/_api/ (JSON) send their own strict CSP, which wins.
# Self-hosting these dependencies and dropping 'unsafe-inline' is the first modernization item for _api.
<LocationMatch "^/home/_api/">
    Header always setifempty Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://npmcdn.com https://commerce.coinbase.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://image.flaticon.com https://media1.giphy.com https://media4.giphy.com; media-src 'self'; connect-src 'self' https://min-api.cryptocompare.com wss://streamer.cryptocompare.com https://api.exchangerate-api.com; frame-src 'self' https://commerce.coinbase.com; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'"
    Header always setifempty X-Frame-Options "SAMEORIGIN"
    Header always setifempty Referrer-Policy "strict-origin-when-cross-origin"
</LocationMatch>
