# ALIEV.IO local development:   docker compose up --build   →   http://localhost:8080
#   stop:   docker compose down            reset the database:   docker compose down -v
#   other port:   WEB_PORT=8088 docker compose up --build
#
# Two services only: the PHP/Apache app and MariaDB (auth and careers need a database).
# The database is NOT published to the host. The passwords below are development-only defaults;
# production uses real secrets from the environment (docs/DEPLOYMENT.md).
services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${WEB_PORT:-8080}
      APP_KEY: ${APP_KEY:-local-development-key-change-me-0123456789}
      FORCE_HTTPS: "false"
      LOG_CHANNEL: stderr
      NOTIFY_DRIVER: log
      DB_DRIVER: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-aliev}
      DB_USERNAME: ${DB_USERNAME:-aliev}
      DB_PASSWORD: ${DB_PASSWORD:-dev-only-change-me}
      AUTH_ENABLED: "true"
      SEED_DEV_DATA: "true"      # fictional sample job postings (database/seeds), development only
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-aliev}
      MARIADB_USER: ${DB_USERNAME:-aliev}
      MARIADB_PASSWORD: ${DB_PASSWORD:-dev-only-change-me}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
