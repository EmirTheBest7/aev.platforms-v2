<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title>QR generator</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" /><link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.1.3/css/bootstrap.min.css'><link rel="stylesheet" href="./style.css">

</head>
<body>
<!-- partial:index.partial.html -->
<input id="text" type="text" value="#EMPTY" style="width:200px" class="mt-4" />
<div id="qrcode" style="width:200px; height:200px; margin-top:15px;"></div>
<button class="button" style="top: 20px; position: relative; border: none; display: block;" onclick="downloadFile()">WebQR</button>
<!-- partial -->
  <script src='https://cdn.jsdelivr.net/gh/baroninn/qrcodejs@master/jquery.min.js'></script>
<script src='https://cdn.jsdelivr.net/gh/baroninn/qrcodejs@master/qrcode.js'></script><script  src="./script.js"></script>

<script>
function downloadFile() {
    const fileName = 'SmartyExt.zip'; // Replace with your actual file name
    const filePath = 'https://aliev.io/home/_api/UI/terminal/Tools/qr/SmartyQR/' + fileName; // Replace with the correct file path

    const link = document.createElement('a');
    link.href = filePath;
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}
</script>


</body>
</html>
