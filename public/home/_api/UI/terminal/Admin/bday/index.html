<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">


  <title>CodePen - Countdown Timer</title>
  <link rel="stylesheet" href="./style.css">

</head>

<body>
  <!-- partial:index.partial.html -->
  <div class="container">
    <h1 id="headline">Countdown to my birthday:</h1>
    <div id="countdown">
      <ul>
        <li><span id="days"></span>days</li>
        <li><span id="hours"></span>Hours</li>
        <li><span id="minutes"></span>Minutes</li>
        <li><span id="seconds"></span>Seconds</li>
      </ul>
    </div>
    <div id="content" class="emoji">
      <span>🥳</span>
      <span>🎉</span>
      <span>🎂</span>
    </div>


<div id="app" v-cloak="v-cloak">
  <h3>Greatness is coming</h3>
  <h1>
     <b><u>{{ timeSinceLastIncident }}</u></b> Days</h1>
</div>



  </div>
  <!-- partial -->
  <script src='https://code.jquery.com/jquery-2.2.4.min.js'></script>
  <script src='https://cdnjs.cloudflare.com/ajax/libs/vue/1.0.26/vue.min.js'></script>
  <script src='https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.18.0/moment.min.js'></script>
  <script src="./script.js"></script>

  <script>
    const lastIncidentDate = moment('09/24/21')

    const app = new Vue({
      el: '#app',
      data: {
        now: moment(),
        lastIncidentDate
      },
      computed: {
        timeSinceLastIncident() {
          return this.lastIncidentDate.diff(moment(), 'days') * -1
        }
      }
    })
  </script>


</body>

</html>
