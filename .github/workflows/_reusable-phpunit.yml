# =============================================================================
# Reusable Workflow: PHPUnit
# =============================================================================
# Purpose:
#   Runs the PHPUnit test suite. DORMANT by design until the project adds
#   phpunit/phpunit as a dev dependency and a phpunit.xml(.dist) config —
#   until then this job self-detects absence and skips cleanly instead of
#   failing CI on a feature that doesn't exist yet.
#
# Called by: workflows/ci.yml
#
# Activation checklist (when ready):
#   1. composer require --dev phpunit/phpunit
#   2. Add phpunit.xml.dist to the repo root
#   3. Nothing else to change here — this job auto-detects and runs.
#
# Design notes:
#   - Optionally spins up a MySQL/MariaDB service container so integration
#     tests hitting a real database work out of the box.
#   - Uses matrix on PHP version to mirror the lint job's coverage.
# =============================================================================

name: "Reusable / PHPUnit"

on:
  workflow_call:
    inputs:
      php-versions:
        description: "JSON array of PHP versions to test against"
        type: string
        default: '["8.3"]'
        required: false
      use-database:
        description: "Whether to start a MariaDB service container for the test run"
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  phpunit:
    name: "PHPUnit (PHP ${{ matrix.php-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ${{ fromJSON(inputs.php-versions) }}

    # Service container is always declared, but only meaningfully used when
    # `use-database` is true and the test suite actually connects to it.
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: aliev_io_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Check for PHPUnit configuration"
        id: check
        run: |
          if [ -f "phpunit.xml" ] || [ -f "phpunit.xml.dist" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No phpunit.xml(.dist) found — skipping PHPUnit run. See activation checklist in this workflow file."
          fi

      - name: "Set up PHP ${{ matrix.php-version }}"
        if: steps.check.outputs.exists == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: xdebug
          tools: composer:v2
          extensions: mbstring, pdo, pdo_mysql

      - name: "Cache Composer dependencies"
        if: steps.check.outputs.exists == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: "Install Composer dependencies"
        if: steps.check.outputs.exists == 'true'
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: "Wait for MariaDB to be ready"
        if: steps.check.outputs.exists == 'true' && inputs.use-database
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h127.0.0.1 -P3306 -uroot -proot --silent && break
            echo "Waiting for MariaDB... ($i/30)"
            sleep 2
          done

      - name: "Run PHPUnit"
        if: steps.check.outputs.exists == 'true'
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: aliev_io_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: vendor/bin/phpunit --colors=always

      - name: "Upload coverage report"
        if: steps.check.outputs.exists == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-coverage-php${{ matrix.php-version }}
          path: |
            coverage/
            .phpunit.cache/
          if-no-files-found: ignore
          retention-days: 14
