name: "Question"
description: "Ask a question about using or contributing to ALIEV.IO V2"
title: "[Question]: "
labels: ["question", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        For general or open-ended questions, consider using
        [Discussions](../discussions) instead — it's better suited for
        back-and-forth conversation. Use this template for a specific,
        answerable question tied to the codebase.

  - type: textarea
    id: question
    attributes:
      label: "Your Question"
      description: "Be as specific as possible."
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: "Context"
      description: "What are you trying to do? What have you already tried?"
    validations:
      required: false
